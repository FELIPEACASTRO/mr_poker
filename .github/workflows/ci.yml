name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pip install pip-audit bandit
      - run: pip-audit --strict || true
      - run: bandit -r packages services apps -ll -q || true
      - run: pytest tests/unit tests/property tests/e2e tests/integration --cov=packages --cov=services --cov-report=term-missing -q
