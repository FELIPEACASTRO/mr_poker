[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-pocker"
version = "1.0.0-alpha"
description = "mr_pocker: local-first Texas Hold'em NL Heads-Up AI training and evaluation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "eval7>=0.1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "httpx>=0.27",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*", "apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
implicit_reexport = true
warn_unused_configs = true
follow_imports = "skip"
files = [
  "services/cqrs",
  "services/session_service/service.py",
  "packages/equity/monte_carlo.py",
  "packages/evaluator/hands.py",
  "packages/persistence/sqlite_store.py",
  "packages/baseline_agent",
  "packages/external_solver/adapter.py",
  "services/external_solver_service/service.py",
  "infra/scripts/perf_gate_v1.py",
]
